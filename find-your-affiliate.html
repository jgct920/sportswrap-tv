    <main>
      <section class="finder-hero">
        <p class="kicker">Affiliates</p>
        <h1>Find Your Affiliate</h1>

          Search by city, market, station, or network to find where SportsWrap w/Jason Page airs near you
        </p>
      </section>

      <section class="finder-section" aria-label="Interactive affiliate map">
        <iframe
          id="sportswrap-affiliate-map"
          src="/affiliate-map.html"
          title="Find your SportsWrap affiliate and airtime"
          style="display:block;width:100%;height:760px;border:0;"
          loading="lazy"
        ></iframe>

        <script>
        (() => {
          const frame = document.getElementById('sportswrap-affiliate-map');

          window.addEventListener('message', event => {
            if (
              event.origin !== window.location.origin ||
              event.source !== frame.contentWindow ||
              event.data?.type !== 'sportswrap-affiliate-map-height'
            ) return;

            const height = Number(event.data.height);

            if (Number.isFinite(height) && height >= 200 && height <= 5000) {
              frame.style.height = Math.ceil(height) + 'px';
            }
          });
        })();
        </script>
      </section>
