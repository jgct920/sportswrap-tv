name: Update latest podcast episode

on:
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"

permissions:
  contents: write

jobs:
  update-latest-podcast:
    runs-on: ubuntu-latest

    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch newest podcast episode
        env:
          PODCAST_RSS_URL: https://feeds.simplecast.com/KCzCpgZ0
        run: node scripts/update-podcast.js

      - name: Commit latest podcast update
        run: |
          if git diff --quiet data/latest-podcast.json; then
            echo "No podcast update found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-podcast.json
          git commit -m "Update latest SportsWrap podcast episode"
          git pull --rebase origin main
          git push
