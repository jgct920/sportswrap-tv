name: Update latest YouTube video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-latest-video:
    runs-on: ubuntu-latest

    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch newest playlist video
        env:
          YOUTUBE_PLAYLIST_ID: PLaJljr_tBa-59G96I3EDcBOQOmNVyirpQ
        run: node scripts/update-youtube.js

      - name: Commit latest video update
        run: |
          if git diff --quiet data/latest-video.json; then
            echo "No video update found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-video.json
          git commit -m "Update latest SportsWrap YouTube video"
          git push
