<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SportsWrap.tv | Coming Soon</title>
    <style>
      :root {
        --orange: #f47b16;
        --green: #00843d;
        --black: #080808;
        --white: #ffffff;
        --muted: rgba(255, 255, 255, 0.72);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        color: var(--white);
        background:
          linear-gradient(135deg, rgba(8, 8, 8, 0.98), rgba(8, 8, 8, 0.9)),
          radial-gradient(circle at 20% 20%, rgba(244, 123, 22, 0.22), transparent 34%),
          radial-gradient(circle at 84% 72%, rgba(0, 132, 61, 0.18), transparent 30%),
          var(--black);
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
        padding: 28px;
      }

      main {
        width: min(860px, 100%);
      }

      .logo {
        display: block;
        width: min(520px, 86vw);
        height: 190px;
        object-fit: cover;
        object-position: center;
        margin: 0 auto 32px;
        filter: drop-shadow(0 18px 34px rgba(0, 0, 0, 0.55));
      }

      h1 {
        margin: 0;
        color: var(--white);
        font-size: clamp(2.4rem, 8vw, 5.8rem);
        line-height: 0.94;
        text-transform: uppercase;
      }

      p {
        max-width: 640px;
        margin: 22px auto 0;
        color: var(--muted);
        font-size: clamp(1.05rem, 2vw, 1.35rem);
        font-weight: 700;
        line-height: 1.45;
      }

      .show-logo {
        display: block;
        width: min(320px, 74vw);
        height: 118px;
        object-fit: cover;
        object-position: center;
        margin: 34px auto 0;
        opacity: 0.92;
      }

      .bar {
        width: min(320px, 70vw);
        height: 5px;
        margin: 34px auto 0;
        background: linear-gradient(90deg, var(--orange), var(--green));
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="assets/sportswrap-productions-logo.png" alt="SportsWrap Productions" />
      <h1>Coming Soon</h1>
      <p>
        SportsWrap Productions is preparing the new home of SportsWrap w/Jason Page
      </p>
      <div class="bar" aria-hidden="true"></div>
      <img class="show-logo" src="assets/sportswrap-jason-page-logo.png" alt="SportsWrap w/Jason Page" />
    </main>
  </body>
</html>
